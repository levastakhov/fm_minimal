name: Build Minimal FMRadio APK

on:
  push:
    branches: [ "lineage-18.1", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Project & Stubs
        run: |
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }

          android {
              namespace 'com.android.fmradio'
              compileSdk 29

              defaultConfig {
                  applicationId "com.android.fmradio"
                  minSdk 26
                  targetSdk 29
                  versionCode 1
                  versionName "1.0-minimal"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              sourceSets {
                  main {
                      manifest.srcFile '../AndroidManifest.xml'
                      java.srcDirs = ['src/stubs/java', '../src']
                  }
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          mkdir -p app/src/stubs/java/android/media
          cat << 'EOF' > app/src/stubs/java/android/media/AudioSystem.java
          package android.media;
          public class AudioSystem {
              public static final int FORCE_NONE = 0;
              public static final int FORCE_SPEAKER = 1;
              public static final int FOR_MEDIA = 1;
              public static final int DEVICE_IN_FM_TUNER = 0x80000400;

              public static int setForceUse(int usage, int config) { return 0; }
              public static int getForceUse(int usage) { return 0; }
          }
          EOF

          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Minimal APK
        uses: actions/upload-artifact@v4
        with:
          name: Minimal-FMRadio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
